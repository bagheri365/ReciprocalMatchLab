notes:
- Candidate features should be reconstructed by joining Time-1 participant attributes
  via pid, not by trusting *_o mirror columns.
- int_corr is documented as a Time-1 interest-correlation feature and is allowed as
  a derived pair feature.
- met/met_o are excluded because they were recorded on the post-date scorecard even
  though the underlying fact may predate the event.
- Milestone 3 drops questionnaire-block features with entire-wave absence from the
  primary model rather than imputing protocol availability.
