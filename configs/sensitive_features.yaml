version: 2

primary_model_policy:
  description: "Primary model excludes sensitive demographic variables and strong socioeconomic/location proxies."

audit_only_features:
  - race
  - race_o
  - samerace
  - imprace
  - imprelig
  - income
  - zipcode
  - undergra
  - mn_sat
  - tuition
  - from

excluded_free_text_or_high_cardinality:
  - field
  - career

notes:
  - "Audit-only does not mean these variables are harmless; it means they are retained only for diagnostics/sensitivity work."
  - "Do not make subgroup fairness claims unless sample sizes and estimands are explicitly justified."
