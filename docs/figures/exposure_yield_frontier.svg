<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Exposure-yield frontier</title>
  <desc id="desc">PairMatchRate decreases modestly as relative exposure Gini decreases across increasing exposure penalties.</desc>
  <rect width="760" height="420" fill="white"/>
  <text x="380" y="32" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="600">Exposure–yield frontier</text>
  <line x1="90" y1="350" x2="710" y2="350" stroke="#444" stroke-width="1.2"/>
  <line x1="90" y1="60" x2="90" y2="350" stroke="#444" stroke-width="1.2"/>
  <text x="400" y="400" text-anchor="middle" font-family="sans-serif" font-size="14">Relative exposure Gini (lower is less concentrated)</text>
  <text x="22" y="205" text-anchor="middle" font-family="sans-serif" font-size="14" transform="rotate(-90 22 205)">PairMatchRate (higher is better)</text>

  <g font-family="sans-serif" font-size="12" fill="#333">
    <text x="90" y="370" text-anchor="middle">0.40</text>
    <text x="245" y="370" text-anchor="middle">0.33</text>
    <text x="400" y="370" text-anchor="middle">0.26</text>
    <text x="555" y="370" text-anchor="middle">0.19</text>
    <text x="710" y="370" text-anchor="middle">0.12</text>
    <text x="78" y="350" text-anchor="end">0.158</text>
    <text x="78" y="278" text-anchor="end">0.162</text>
    <text x="78" y="205" text-anchor="end">0.166</text>
    <text x="78" y="133" text-anchor="end">0.170</text>
    <text x="78" y="60" text-anchor="end">0.174</text>
  </g>

  <g stroke="#ddd" stroke-width="1">
    <line x1="90" y1="278" x2="710" y2="278"/>
    <line x1="90" y1="205" x2="710" y2="205"/>
    <line x1="90" y1="133" x2="710" y2="133"/>
  </g>

  <polyline points="105,121 112,121 209,190 333,275 503,277 667,345" fill="none" stroke="#3b6ea8" stroke-width="2.5"/>
  <g fill="#3b6ea8" stroke="white" stroke-width="1.5">
    <circle cx="105" cy="121" r="5"/>
    <circle cx="112" cy="121" r="5"/>
    <circle cx="209" cy="190" r="5"/>
    <circle cx="333" cy="275" r="5"/>
    <circle cx="503" cy="277" r="5"/>
    <circle cx="667" cy="345" r="5"/>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#222">
    <text x="117" y="110">λ=0.00</text>
    <text x="124" y="139">λ=0.01</text>
    <text x="221" y="180">λ=0.05</text>
    <text x="345" y="265">λ=0.10</text>
    <text x="515" y="267">λ=0.20</text>
    <text x="655" y="330" text-anchor="end">λ=0.50</text>
  </g>
</svg>
